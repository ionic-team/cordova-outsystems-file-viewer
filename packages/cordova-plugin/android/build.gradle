buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

dependencies{
    implementation("io.ionic.libs:ionfileviewer-android:99.0.0-rmet5348@aar")

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    implementation "androidx.appcompat:appcompat:1.7.0"
}


android {
    buildTypes {
        debug {
            // do not upload debug versions to crashlytics
        }
    }
    packagingOptions {
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
    }
}

// RMET-5348 TEST ONLY - do not merge: resolve the locally built native library bundled in this plugin (local-maven-ionfileviewer-android)
repositories {
    maven { url "${rootDir}/app/src/main/local-maven-ionfileviewer-android" }
}
